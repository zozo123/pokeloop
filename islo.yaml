# Islo Configuration for pokeloop GA demo
sandbox: pokeloop-demo
image: docker.io/library/python:3.12-slim

cpus: 2
memory_mb: 2048
disk_gb: 5

sources:
  - url: https://github.com/zozo123/pokeloop
    branch: main

env:
  PYTHONUNBUFFERED: "1"
  POKELOOP_PORT: "8081"

setup_script: |
  set -e
  apt-get update -qq
  apt-get install -qq -y curl tmux
  pip install --quiet --no-input fastapi 'uvicorn[standard]' pillow pydantic websockets httpx
  echo "[setup] dependencies installed"
