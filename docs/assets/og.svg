<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcb05"/>
      <stop offset="1" stop-color="#3b4cca"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0d1117"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#g)"/>

  <!-- brand -->
  <circle cx="86" cy="92" r="9" fill="#ffcb05"/>
  <text x="108" y="101" font-family="Menlo, monospace" font-size="26" font-weight="700" fill="#e6edf3">pokeloop</text>

  <!-- label -->
  <rect x="80" y="146" width="226" height="40" rx="8" fill="rgba(255,203,5,0.10)" stroke="#ffcb05" stroke-width="1.5"/>
  <text x="193" y="173" text-anchor="middle" font-family="Menlo, monospace" font-size="18" font-weight="700" fill="#ffcb05" letter-spacing="2">SCRIPTED DEMO</text>

  <!-- title -->
  <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" fill="#e6edf3" letter-spacing="-1.5">
    <tspan x="78" y="270" font-size="66">Pokeloop:</tspan>
    <tspan x="78" y="346" font-size="66">prompt-evolution</tspan>
    <tspan x="78" y="422" font-size="66" fill="#ffcb05">sandbox demo</tspan>
  </text>

  <text x="80" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">GA over LLM system prompts on parallel islo.dev sandboxes</text>

  <!-- population grid motif (2 x 4) -->
  <g transform="translate(780,150)">
    <g font-family="Menlo, monospace" font-size="13" fill="#8b949e">
      <rect x="0"   y="0"   width="80" height="72" rx="8" fill="#161b22" stroke="#ffcb05" stroke-width="2"/>
      <rect x="96"  y="0"   width="80" height="72" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <rect x="192" y="0"   width="80" height="72" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <rect x="288" y="0"   width="80" height="72" rx="8" fill="#161b22" stroke="#ffcb05" stroke-width="2"/>
      <rect x="0"   y="88"  width="80" height="72" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <rect x="96"  y="88"  width="80" height="72" rx="8" fill="#161b22" stroke="#3b4cca" stroke-width="2"/>
      <rect x="192" y="88"  width="80" height="72" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <rect x="288" y="88"  width="80" height="72" rx="8" fill="#161b22" stroke="#3b4cca" stroke-width="2"/>
      <text x="12"  y="24">v1</text><text x="108" y="24">v2</text><text x="204" y="24">v3</text><text x="300" y="24">v4</text>
      <text x="12"  y="112">v5</text><text x="108" y="112">v6</text><text x="204" y="112">v7</text><text x="300" y="112">v8</text>
    </g>
    <!-- tiny frame stripes inside cells -->
    <g fill="#30363d">
      <rect x="12" y="38" width="56" height="6" rx="3"/><rect x="12" y="50" width="38" height="6" rx="3"/>
      <rect x="108" y="38" width="44" height="6" rx="3"/><rect x="108" y="50" width="56" height="6" rx="3"/>
      <rect x="204" y="38" width="56" height="6" rx="3"/><rect x="204" y="50" width="30" height="6" rx="3"/>
      <rect x="300" y="38" width="48" height="6" rx="3"/><rect x="300" y="50" width="56" height="6" rx="3"/>
      <rect x="12" y="126" width="40" height="6" rx="3"/><rect x="12" y="138" width="56" height="6" rx="3"/>
      <rect x="108" y="126" width="56" height="6" rx="3"/><rect x="108" y="138" width="44" height="6" rx="3"/>
      <rect x="204" y="126" width="34" height="6" rx="3"/><rect x="204" y="138" width="56" height="6" rx="3"/>
      <rect x="300" y="126" width="56" height="6" rx="3"/><rect x="300" y="138" width="40" height="6" rx="3"/>
    </g>
    <!-- crossover arrows into next generation -->
    <g stroke="#8b949e" stroke-width="1.5" fill="none" opacity=".8">
      <path d="M40 160 C 40 200, 184 196, 184 228"/>
      <path d="M328 160 C 328 200, 184 196, 184 228"/>
    </g>
    <rect x="124" y="228" width="120" height="40" rx="8" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
    <text x="184" y="254" text-anchor="middle" font-family="Menlo, monospace" font-size="15" fill="#4ade80">gen N+1</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#30363d" stroke-width="1.5"/>
  <text x="80" y="582" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Yossi Eliaz</text>
  <text x="1120" y="582" text-anchor="end" font-family="Menlo, monospace" font-size="20" fill="#8b949e">zozo123.github.io/pokeloop</text>
</svg>
